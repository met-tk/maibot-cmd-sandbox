<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="沙盒终端与系统控制">
  <title>沙盒终端与系统控制</title>
  <defs>
    <!-- 背景：科技青蓝渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- 顶部环境光 -->
    <radialGradient id="topGlow" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- 显示器金属外框 -->
    <linearGradient id="monitorFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- 底座立柱 -->
    <linearGradient id="standGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- 投影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 圆角底板 (符合 MaiBot 卡片风格 rx=30) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#topGlow)"/>

  <!-- 电脑与终端组合 -->
  <g filter="url(#shadow)">
    <!-- 支架立柱 -->
    <rect x="58" y="78" width="12" height="14" rx="2" fill="url(#standGrad)"/>

    <!-- 支架底座 -->
    <rect x="42" y="90" width="44" height="6" rx="3" fill="url(#monitorFrame)"/>

    <!-- 显示器外壳 -->
    <rect x="20" y="24" width="88" height="58" rx="8" fill="url(#monitorFrame)"/>

    <!-- 屏幕黑边/显示区域 -->
    <rect x="24" y="28" width="80" height="48" rx="4" fill="#0B1329"/>

    <!-- 窗口控制三色圆点 -->
    <circle cx="31" cy="34" r="2" fill="#EF4444"/>
    <circle cx="37" cy="34" r="2" fill="#F59E0B"/>
    <circle cx="43" cy="34" r="2" fill="#10B981"/>

    <!-- 窗口分隔线 -->
    <line x1="24" y1="39" x2="104" y2="39" stroke="#1E293B" stroke-width="1"/>

    <!-- 终端命令行提示符 >_ -->
    <path d="M31 46 L37 50.5 L31 55" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="55" x2="50" y2="55" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 模拟终端输出代码/状态流 -->
    <rect x="31" y="61" width="42" height="2.5" rx="1.25" fill="#4ADE80" opacity="0.85"/>
    <rect x="31" y="67" width="56" height="2.5" rx="1.25" fill="#94A3B8" opacity="0.6"/>
  </g>
</svg>
